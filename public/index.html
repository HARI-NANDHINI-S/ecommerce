<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-store-name>My Store</title>
  <meta name="description" content="Premium white-label e-commerce store" />
  <link rel="icon" href="/assets/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body class="theme-light">
  <!-- Navbar -->
  <header class="navbar" id="navbar"></header>

  <!-- Main content -->
  <div id="app">
    <!-- Hero Section -->
    <section class="hero" id="hero">
      <div class="hero-content">
        <h1 class="hero-title" data-store-name>Welcome to My Store</h1>
        <p class="hero-subtitle">Discover premium products</p>
        <a href="#/shop" class="btn-primary">Shop Now</a>
      </div>
    </section>

    <!-- Featured Products -->
    <section class="section" id="featured">
      <h2 class="section-title">Featured Products</h2>
      <div class="product-grid" id="featured-grid"></div>
    </section>

    <!-- Trending Products -->
    <section class="section" id="trending">
      <h2 class="section-title">Trending Now</h2>
      <div class="product-grid" id="trending-grid"></div>
    </section>

    <!-- Categories Overview -->
    <section class="section" id="categories">
      <h2 class="section-title">Shop by Category</h2>
      <div class="category-grid" id="category-grid"></div>
    </section>

    <!-- Newsletter -->
    <section class="section" id="newsletter">
      <h2 class="section-title">Stay Updated</h2>
      <form id="newsletter-form" class="newsletter-form">
        <input type="email" placeholder="Your email" required />
        <button type="submit" class="btn-primary">Subscribe</button>
      </form>
    </section>
  </div>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Environment config for static serving -->
  <script>
    window.ENV = {
      SUPABASE_URL: localStorage.getItem('SUPABASE_URL') || 'https://lwdcrfeziaqblsxltncb.supabase.co',
      SUPABASE_ANON_KEY: localStorage.getItem('SUPABASE_ANON_KEY') || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx3ZGNyZmV6aWFxYmxzeGx0bmNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMDg2NjQsImV4cCI6MjA5NzU4NDY2NH0.YQ_Ek78X1vSIEycpm1PaMxoS9vqUaEZNWXD1hula69g',
      PAYPAL_CLIENT_ID: localStorage.getItem('PAYPAL_CLIENT_ID') || 'AdxS6F0ifndqYODLstONTRgCxlCmwjt7LtMEhc4Ec6EF3DEY3qCVcSIaCO0UOjkjC6lNloQJap1UF_8b',
      SITE_URL: window.location.origin,
      USE_MOCK_API: false
    };
  </script>

  <script type="module">
    import { initRouter } from '/assets/js/router.js';
    import { loadStoreSettings } from '/assets/js/storeSettings.js';
    import { initToast } from '/assets/js/toast.js';
    import { initNavbar } from '/assets/js/navbar.js';
    import { initFooter } from '/assets/js/footer.js';
    import { renderProductGrid } from '/assets/js/productLoader.js';
    
    // Initialize app
    async function init() {
      console.log('Initializing application...');
      
      try {
        // Load store settings
        await loadStoreSettings();
      } catch (e) {
        console.warn('Could not load store settings:', e);
      }
      
      // Initialize components
      initToast();
      initNavbar();
      initFooter();
      
      // Load and render products
      try {
        await renderProductGrid('featured-grid');
        await renderProductGrid('trending-grid');
      } catch (e) {
        console.warn('Could not load products:', e);
      }
      
      // Initialize router
      initRouter();
    }
    
    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
