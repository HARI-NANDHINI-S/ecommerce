<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout – <span id="store-name"></span></title>
  <link rel="stylesheet" href="/assets/css/style.css" />
  <script type="module" src="/assets/js/app.js" defer></script>
</head>
<body>
  <header id="navbar"></header>
  <main class="container">
    <h1 class="mt-3 mb-2">Checkout</h1>
    <section id="order-summary" class="mb-3">
      <h2>Order Summary</h2>
      <div id="summary-items" class="grid"></div>
      <p>Total: <span id="summary-total" class="price"></span></p>
    </section>
    <section id="address-section" class="mb-3">
      <h2>Shipping Address</h2>
      <form id="address-form">
        <input type="text" name="line1" placeholder="Address line 1" required />
        <input type="text" name="line2" placeholder="Address line 2" />
        <input type="text" name="city" placeholder="City" required />
        <input type="text" name="state" placeholder="State / Province" required />
        <input type="text" name="postal_code" placeholder="Postal / ZIP code" required />
        <input type="text" name="country" placeholder="Country" required />
        <button type="submit" class="btn-primary">Save Address</button>
      </form>
    </section>
    <section id="payment-section" class="mb-3">
      <h2>Payment</h2>
      <button id="pay-button" class="btn-primary">Pay with Razorpay</button>
    </section>
  </main>
  <footer id="footer"></footer>
  <div id="toast-container"></div>
</body>
</html>
