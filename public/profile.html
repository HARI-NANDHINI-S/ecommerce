<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-store-name>User Profile – My Store</title>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/layout.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <script type="module" src="../assets/js/app.js" defer></script>
</head>
<body class="theme-light">
  <header class="navbar" id="navbar"></header>
  <main class="container">
    <h1 class="page-title">My Profile</h1>
    <section class="profile-section" id="profile-section">
      <!-- Profile details will be injected here -->
      <div class="card" id="profile-card">
        <div class="card-body">
          <h2 class="card-title" id="profile-name">User Name</h2>
          <p id="profile-email">user@example.com</p>
          <button class="button button-primary" id="edit-profile-btn">Edit Profile</button>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="footer"></footer>
</body>
</html>
